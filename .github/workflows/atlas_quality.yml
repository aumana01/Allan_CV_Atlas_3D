name: Atlas — quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  stable-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/globe.js
      - run: node --check js/app.js
      - run: node --check js/i18n.js
      - run: node --test tests/globe_regression.test.cjs
