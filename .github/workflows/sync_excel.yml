name: Synchronize project Excel
on:
  push:
    branches: [main]
    paths:
      - "data/proyectos.csv"
      - "scripts/sync_excel_from_csv.py"
      - ".github/workflows/sync_excel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Excel library
        run: python -m pip install openpyxl
      - name: Synchronize workbook
        run: python scripts/sync_excel_from_csv.py
      - name: Commit synchronized workbook
        run: |
          if ! git diff --quiet -- data/proyectos.xlsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/proyectos.xlsx
            git commit -m "Sync Excel master descriptions from project catalog"
            git push
          fi
